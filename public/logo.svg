<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 550" width="100%" height="100%">
  <defs>
    <!-- Gradients & Filters -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2a59"/>
      <stop offset="50%" stop-color="#0f1738"/>
      <stop offset="100%" stop-color="#1b2a59"/>
    </linearGradient>

    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1d2d5a"/>
      <stop offset="100%" stop-color="#0d1530"/>
    </linearGradient>

    <linearGradient id="redBanner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e62e2e"/>
      <stop offset="100%" stop-color="#b31212"/>
    </linearGradient>

    <linearGradient id="bookGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f0f2f8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="550" fill="none"/>

  <!-- Outer Laurel Wreath Leaves (Left & Right) -->
  <g fill="#1a2754" stroke="#0d1530" stroke-width="0.5">
    <!-- Left Wreath -->
    <path d="M 190 410 C 130 410 70 340 50 250 C 70 260 110 320 180 390 Z"/>
    <path d="M 170 380 C 100 370 40 280 40 200 C 60 210 100 280 160 350 Z"/>
    <circle cx="65" cy="270" r="7"/>
    <circle cx="50" cy="220" r="6"/>
    <circle cx="75" cy="320" r="7"/>
    <circle cx="100" cy="360" r="8"/>
    <circle cx="135" cy="395" r="8"/>

    <!-- Right Wreath -->
    <path d="M 310 410 C 370 410 430 340 450 250 C 430 260 390 320 320 390 Z"/>
    <path d="M 330 380 C 400 370 460 280 460 200 C 440 210 400 280 340 350 Z"/>
    <circle cx="435" cy="270" r="7"/>
    <circle cx="450" cy="220" r="6"/>
    <circle cx="425" cy="320" r="7"/>
    <circle cx="400" cy="360" r="8"/>
    <circle cx="365" cy="395" r="8"/>
  </g>

  <!-- Main Shield Outer Outline -->
  <g filter="url(#shadow)">
    <path d="M 110 80 
             L 390 80 
             C 390 280 380 380 250 440 
             C 120 380 110 280 110 80 Z" 
          fill="url(#shieldBorder)" stroke="#3a4b82" stroke-width="4"/>

    <!-- Inner Shield Frame -->
    <path d="M 118 88 
             L 382 88 
             C 382 275 372 372 250 430 
             C 128 372 118 275 118 88 Z" 
          fill="#0f1738" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Upper Quadrants Container -->
  <!-- Top Left Quadrant: India Map & Tricolor -->
  <g>
    <rect x="122" y="92" width="124" height="75" fill="#ffffff" rx="2"/>
    <!-- India Map Tricolor Graphic -->
    <path d="M 160 100 L 190 100 L 205 115 L 200 135 L 185 155 L 170 160 L 160 145 L 155 125 Z" fill="#FF9933" opacity="0.9"/>
    <path d="M 160 115 L 195 115 L 198 135 L 180 145 L 165 135 Z" fill="#ffffff"/>
    <path d="M 162 130 L 190 130 L 185 155 L 170 160 L 162 145 Z" fill="#138808"/>
    <!-- Ashoka Chakra -->
    <circle cx="178" cy="128" r="6" fill="none" stroke="#000080" stroke-width="1.2"/>
    <path d="M 178 122 L 178 134 M 172 128 L 184 128" stroke="#000080" stroke-width="0.8"/>
  </g>

  <!-- Top Right Quadrant: Wisdom Profile -->
  <g>
    <rect x="250" y="92" width="128" height="75" fill="#0d1530" rx="2"/>
    <!-- Head Silhouette -->
    <path d="M 310 110 
             C 325 110 335 120 335 132 
             C 335 140 328 148 322 150 
             L 322 158 L 300 158 L 300 150 
             C 295 145 292 138 292 130 
             C 292 118 300 110 310 110 Z" fill="#ffffff"/>
    <!-- Fist / Power icon inside head -->
    <path d="M 306 122 L 314 122 L 314 132 L 306 132 Z" fill="#0d1530"/>
  </g>

  <!-- Middle Left Quadrant: Symbols of Harmony & Books -->
  <g>
    <rect x="122" y="170" width="124" height="60" fill="#161f42" rx="2"/>
    <!-- Om -->
    <text x="132" y="192" font-family="sans-serif" font-weight="bold" font-size="14" fill="#e65100">ॐ</text>
    <!-- Stack of Green Books -->
    <g transform="translate(155, 175)">
      <circle cx="20" cy="18" r="18" fill="#2e7d32"/>
      <rect x="10" y="10" width="20" height="4" fill="#ffffff" rx="1"/>
      <rect x="10" y="16" width="20" height="4" fill="#ffffff" rx="1"/>
      <rect x="10" y="22" width="20" height="4" fill="#ffffff" rx="1"/>
    </g>
    <!-- Star & Crescent -->
    <text x="202" y="190" font-family="sans-serif" font-weight="bold" font-size="12" fill="#81c784">☪</text>
    <!-- Cross & Khanda -->
    <text x="132" y="218" font-family="sans-serif" font-weight="bold" font-size="12" fill="#ffd54f">☬</text>
    <text x="204" y="220" font-family="sans-serif" font-weight="bold" font-size="14" fill="#ffb74d">✝</text>
  </g>

  <!-- Middle Right Quadrant: Globe -->
  <g>
    <rect x="250" y="170" width="128" height="60" fill="#e8edf7" rx="2"/>
    <!-- Globe Circle -->
    <circle cx="314" cy="200" r="22" fill="#29b6f6" stroke="#0288d1" stroke-width="1.5"/>
    <!-- Green Continents -->
    <path d="M 300 190 C 305 185 320 185 325 192 C 322 200 310 205 300 200 Z" fill="#4caf50"/>
    <path d="M 305 210 C 315 208 325 212 328 218 C 315 222 305 218 305 210 Z" fill="#388e3c"/>
    <!-- Latitude Lines -->
    <ellipse cx="314" cy="200" rx="22" ry="8" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.6"/>
    <line x1="314" y1="178" x2="314" y2="222" stroke="#ffffff" stroke-width="0.8" opacity="0.6"/>
  </g>

  <!-- Grid Divider Lines -->
  <line x1="248" y1="90" x2="248" y2="232" stroke="#ffffff" stroke-width="3"/>
  <line x1="120" y1="168" x2="380" y2="168" stroke="#ffffff" stroke-width="3"/>
  <line x1="120" y1="232" x2="380" y2="232" stroke="#ffffff" stroke-width="3"/>

  <!-- Lower Section: Open 3D Book & MPS Motto -->
  <g transform="translate(130, 240)">
    <!-- Book 3D Cover/Pages -->
    <path d="M 10 70 Q 120 20 120 120 Q 120 20 230 70 L 225 130 Q 120 85 120 120 Q 120 85 15 130 Z" 
          fill="url(#bookGradient)" stroke="#d0d7de" stroke-width="1.5" filter="url(#shadow)"/>
    <path d="M 120 20 L 120 120" stroke="#d32f2f" stroke-width="2.5"/>

    <!-- M.P.S Title on Open Pages -->
    <text x="70" y="62" font-family="'Outfit', 'Arial Black', sans-serif" font-weight="900" font-size="28" fill="#3f51b5" text-anchor="middle">M.</text>
    <text x="120" y="62" font-family="'Outfit', 'Arial Black', sans-serif" font-weight="900" font-size="28" fill="#e91e63" text-anchor="middle">P.</text>
    <text x="170" y="62" font-family="'Outfit', 'Arial Black', sans-serif" font-weight="900" font-size="28" fill="#00bcd4" text-anchor="middle">S</text>

    <!-- Motto Text -->
    <text x="120" y="80" font-family="'Georgia', serif" font-style="italic" font-weight="bold" font-size="9" fill="#2e7d32" text-anchor="middle">
      Make education your dream
    </text>
    <text x="120" y="94" font-family="'Georgia', serif" font-style="italic" font-weight="bold" font-size="8" fill="#1565c0" text-anchor="middle">
      &amp; it will help you to fulfill your dream
    </text>
  </g>

  <!-- Est.2013 Badge -->
  <g transform="translate(205, 412)">
    <rect x="0" y="0" width="90" height="22" rx="11" fill="#ffffff" stroke="#1b2a59" stroke-width="2"/>
    <text x="45" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#0f1738" text-anchor="middle">Est.2013</text>
  </g>

  <!-- Top Ribbon Banner: MODEL PUBLIC SCHOOL -->
  <g filter="url(#shadow)">
    <!-- Curved Top Ribbon -->
    <path d="M 40 85 L 100 55 L 400 55 L 460 85 L 430 115 L 390 90 L 110 90 L 70 115 Z" fill="url(#ribbonGrad)" stroke="#ffffff" stroke-width="1.5"/>
    <path d="M 70 115 L 110 90 L 110 120 Z" fill="#080d21"/>
    <path d="M 430 115 L 390 90 L 390 120 Z" fill="#080d21"/>

    <!-- Header Text -->
    <text x="250" y="80" font-family="'Cinzel', 'Outfit', 'Arial Black', sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="2" text-anchor="middle">
      MODEL PUBLIC SCHOOL
    </text>
  </g>

  <!-- Bottom Red Ribbon Banner: A HAPPY SCHOOL, A BRIGHTER FUTURE -->
  <g filter="url(#shadow)">
    <!-- Banner Fold Tails -->
    <path d="M 20 500 L 70 450 L 100 480 L 50 530 Z" fill="#800a0a"/>
    <path d="M 480 500 L 430 450 L 400 480 L 450 530 Z" fill="#800a0a"/>

    <!-- Main Red Ribbon -->
    <path d="M 40 480 Q 250 520 460 480 L 440 530 Q 250 570 60 530 Z" fill="url(#redBanner)" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Banner Text -->
    <text x="250" y="515" font-family="'Outfit', 'Arial Black', sans-serif" font-weight="900" font-size="16" fill="#ffffff" letter-spacing="1.5" text-anchor="middle">
      A HAPPY SCHOOL, A BRIGHTER FUTURE
    </text>
  </g>
</svg>
